name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file for development
        run: |
          cat > .env.dev << EOF
          # Development Environment Variables
          ENVIRONMENT=development
          
          # Database
          DEV_DATABASE_URL=${{ secrets.DEV_DATABASE_URL }}
          
          # Backend
          DEV_SECRET_KEY=${{ secrets.DEV_SECRET_KEY }}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          
          # AWS
          DEV_AWS_ACCESS_KEY_ID=${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          DEV_AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=us-west-1
          
          # AI
          DEV_ANTHROPIC_API_KEY=${{ secrets.DEV_ANTHROPIC_API_KEY }}
          EOF

      - name: Copy files to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/multitenant-app"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/multitenant-app/

      - name: Copy environment file
        run: |
          scp .env.dev ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/multitenant-app/.env.dev

      - name: Deploy to Development environment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/multitenant-app
            
            # Load environment variables
            export $(cat .env.dev | xargs)
            
            # Stop existing containers
            docker-compose -f docker-compose.dev.yml down
            
            # Remove old images to save space (optional)
            docker image prune -f
            
            # Build and start new containers
            docker-compose -f docker-compose.dev.yml up -d --build
            
            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 15
            
            # Check container status
            docker-compose -f docker-compose.dev.yml ps
          EOF

      - name: Health check
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Check if containers are running
            if ! docker ps | grep -q backend-dev; then
              echo "Backend container not running!"
              exit 1
            fi
            
            if ! docker ps | grep -q frontend-dev; then
              echo "Frontend container not running!"
              exit 1
            fi
            
            # Test backend health endpoint
            max_attempts=10
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              if curl -f http://localhost:8001/health; then
                echo "Backend is healthy!"
                break
              fi
              attempt=$((attempt + 1))
              echo "Attempt $attempt/$max_attempts failed. Retrying..."
              sleep 5
            done
            
            if [ $attempt -eq $max_attempts ]; then
              echo "Backend health check failed after $max_attempts attempts"
              docker-compose -f docker-compose.dev.yml logs backend-dev
              exit 1
            fi
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f .env.dev

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Development deployment successful!"
            echo "Frontend: https://devapp.safespacelabs.cloud"
            echo "Backend:  https://devapi.safespacelabs.cloud"
          else
            echo "❌ Development deployment failed!"
          fi
