version: '3.8'

services:
  backend-dev:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dev
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=${DEV_DATABASE_URL}
      - SECRET_KEY=${DEV_SECRET_KEY:-dev-secret-key-change-this}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - AWS_ACCESS_KEY_ID=${DEV_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${DEV_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-west-1}
      - ANTHROPIC_API_KEY=${DEV_ANTHROPIC_API_KEY}
      - CORS_ORIGINS=https://devapp.safespacelabs.cloud,http://localhost:3000
    volumes:
      - ./backend:/app
    networks:
      - dev-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-dev:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://devapi.safespacelabs.cloud
        - REACT_APP_ENV=development
    container_name: frontend-dev
    ports:
      - "3001:80"
    depends_on:
      - backend-dev
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    driver: bridge
