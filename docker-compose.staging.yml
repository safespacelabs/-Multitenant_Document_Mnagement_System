version: '3.8'

services:
  backend-staging:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-staging
    ports:
      - "8002:8000"
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=${STAGING_DATABASE_URL}
      - SECRET_KEY=${STAGING_SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - AWS_ACCESS_KEY_ID=${STAGING_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${STAGING_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-west-1}
      - ANTHROPIC_API_KEY=${STAGING_ANTHROPIC_API_KEY}
      - CORS_ORIGINS=https://qaapp.safespacelabs.cloud
    networks:
      - staging-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-staging:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://qaapi.safespacelabs.cloud
        - REACT_APP_ENV=staging
    container_name: frontend-staging
    ports:
      - "3002:80"
    depends_on:
      - backend-staging
    networks:
      - staging-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  staging-network:
    driver: bridge
