# Nginx configuration for Hostinger VPS
# Place at: /etc/nginx/sites-available/multitenant-app
# Symlink to: /etc/nginx/sites-enabled/multitenant-app
# Covers: Development + Staging (QA) environments only

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ─────────────────────────────────────────────
# DEVELOPMENT — Backend API  (port 8001)
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name devapi.safespacelabs.cloud;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name devapi.safespacelabs.cloud;

    ssl_certificate     /etc/letsencrypt/live/devapi.safespacelabs.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devapi.safespacelabs.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/dev-api-access.log;
    error_log  /var/log/nginx/dev-api-error.log;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://localhost:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin      "https://devapp.safespacelabs.cloud" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = 'OPTIONS') { return 204; }

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

